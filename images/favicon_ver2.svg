<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 246 246" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve">
  <!-- Background circle -->
  <circle cx="123" cy="123" r="100" fill="#1d4ed8"/>
  
  <!-- Mouse body (cute, simplified) -->
  <g transform="translate(123,130)">
    <!-- Body: rounded teardrop shape -->
    <path d="M-45,20 C-45,-15 -30,-45 0,-45 C30,-45 45,-15 45,20 C45,45 25,60 0,60 C-25,60 -45,45 -45,20 Z" 
          fill="#f5f5f5" stroke="#1e3a8a" stroke-width="3"/>
    
    <!-- Left ear -->
    <ellipse cx="-32" cy="-48" rx="16" ry="18" fill="#f5f5f5" stroke="#1e3a8a" stroke-width="3"/>
    <!-- Inner ear -->
    <ellipse cx="-32" cy="-48" rx="10" ry="12" fill="#fca5a5"/>
    
    <!-- Right ear -->
    <ellipse cx="32" cy="-48" rx="16" ry="18" fill="#f5f5f5" stroke="#1e3a8a" stroke-width="3"/>
    <!-- Inner ear -->
    <ellipse cx="32" cy="-48" rx="10" ry="12" fill="#fca5a5"/>
    
    <!-- Eyes -->
    <circle cx="-14" cy="-8" r="5" fill="#1e3a8a"/>
    <circle cx="14" cy="-8" r="5" fill="#1e3a8a"/>
    <!-- Eye highlights -->
    <circle cx="-12" cy="-10" r="2" fill="#ffffff"/>
    <circle cx="16" cy="-10" r="2" fill="#ffffff"/>
    
    <!-- Nose -->
    <ellipse cx="0" cy="2" rx="4" ry="3" fill="#fca5a5"/>
    
    <!-- Whiskers left -->
    <line x1="-20" y1="4" x1="-48" y1="-2" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-20" y1="8" x1="-48" y1="8" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-20" y1="12" x1="-48" y1="16" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Whiskers right -->
    <line x1="20" y1="4" x1="48" y1="-2" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="8" x1="48" y1="8" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="12" x1="48" y1="16" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Tail -->
    <path d="M40,55 C60,65 70,50 65,40" fill="none" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
